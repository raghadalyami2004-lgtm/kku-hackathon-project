<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Discover the Vision 2030 sector that fits your interests and strengths.">
  <title>Vision 2030 Sector Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ===== Design tokens ===== */
    :root { --bg:#fcfaf5; --surface:#fff; --surface2:#f7f2e8; --text:#173a5a; --muted:#6f6559; --gold:#c8a96a; --gold-soft:#e9d8b7; --navy:#173a5a; --blue:#285f8f; --edge:rgba(23,58,90,.13); --shadow:0 16px 40px rgba(23,58,90,.12); --hero-glow:rgba(200,169,106,.18); --focus:#0b5d98; --overlay:rgba(5,16,29,.72); --radius:22px; }
    [data-theme="dark"] { --bg:#070f19; --surface:rgba(255,255,255,.06); --surface2:rgba(23,58,90,.26); --text:#edf5fb; --muted:#bdc8d4; --gold:#dfbd78; --gold-soft:rgba(223,189,120,.22); --navy:#8dccff; --blue:#6eb8f0; --edge:rgba(216,237,255,.16); --shadow:0 18px 45px rgba(0,0,0,.48),0 0 28px rgba(67,140,207,.11); --hero-glow:rgba(200,169,106,.14); --focus:#f3d18a; --overlay:rgba(0,4,10,.82); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-width:320px; background:var(--bg); color:var(--text); font-family:Tajawal, Arial, sans-serif; font-size:16px; line-height:1.6; transition:background .3s,color .3s; overflow-x:hidden; }
    body.modal-open { overflow:hidden; }
    button,a,input,label { font:inherit; }
    button,a { -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; }
    a { color:inherit; }
    .skip-link { position:fixed; z-index:1000; top:-60px; left:16px; padding:10px 14px; background:var(--navy); color:#fff; border-radius:0 0 12px 12px; transition:top .2s; }
    .skip-link:focus { top:0; }
    :focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
    .container { width:min(1120px,calc(100% - 32px)); margin-inline:auto; }
    .eyebrow { display:block; color:var(--gold); font-weight:800; text-transform:uppercase; letter-spacing:.1em; font-size:.75rem; }
    .section-title { margin:7px 0 8px; font-size:clamp(1.75rem,4vw,3rem); line-height:1.15; font-weight:900; letter-spacing:-.04em; }
    .section-copy { margin:0; max-width:680px; color:var(--muted); font-size:1.06rem; }

    /* ===== Splash ===== */
    .splash { position:fixed; inset:0; z-index:900; display:grid; place-items:center; background:linear-gradient(135deg,#102d49,#173a5a 52%,#214d73); color:#fff; overflow:hidden; }
    .splash::before,.splash::after { content:""; position:absolute; border-radius:50%; border:1px solid rgba(200,169,106,.3); pointer-events:none; }
    .splash::before { width:80vmax; height:80vmax; }
    .splash::after { width:54vmax; height:54vmax; }
    .splash-brand { position:relative; z-index:1; text-align:center; transform-origin:top left; animation:splashPulse .8s ease-in-out infinite alternate; }
    .palm { display:block; font-size:4rem; line-height:1; filter:drop-shadow(0 9px 12px rgba(0,0,0,.22)); }
    .splash-wordmark { margin-top:10px; font-size:clamp(2.2rem,8vw,5rem); font-weight:900; line-height:.94; letter-spacing:-.07em; white-space:nowrap; }
    .splash-wordmark small { display:block; font-size:.42em; font-weight:700; letter-spacing:0; margin-top:10px; }
    .splash-skip { position:absolute; z-index:2; bottom:24px; padding:10px 16px; border:1px solid rgba(255,255,255,.55); color:#fff; background:rgba(255,255,255,.09); border-radius:999px; }
    .splash.shrink .splash-brand { animation:splashFly .9s cubic-bezier(.77,0,.175,1) forwards; }
    .splash.exit { animation:splashExit .55s cubic-bezier(.77,0,.175,1) forwards; }
    @keyframes splashPulse { to { transform:scale(1.05); } }
    @keyframes splashFly { to { transform:translate(calc(-50vw + 85px),calc(-50vh + 52px)) scale(.22); } }
    @keyframes splashExit { to { transform:translateY(-105%); } }

    /* ===== Header & hero ===== */
    header { position:sticky; top:0; z-index:50; border-bottom:1px solid var(--edge); background:color-mix(in srgb,var(--bg) 86%,transparent); backdrop-filter:blur(14px); opacity:0; transform:translateY(-12px); transition:opacity .4s .1s,transform .4s .1s; }
    body.ready header { opacity:1; transform:none; }
    .nav { min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .header-logo { display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--text); font-weight:900; line-height:1; letter-spacing:-.05em; }
    .header-logo b { color:var(--gold); font-size:1.5rem; }
    .header-logo span { font-size:.94rem; }
    .header-actions { display:flex; gap:8px; }
    .toggle { min-height:44px; border:1px solid var(--edge); border-radius:999px; padding:0 13px; background:var(--surface); color:var(--text); font-weight:800; transition:transform .2s,border-color .2s,background .2s; }
    .toggle:hover { border-color:var(--gold); transform:translateY(-2px); }
    .hero { padding:clamp(60px,10vw,112px) 0 62px; position:relative; overflow:hidden; }
    .hero::before { content:""; position:absolute; width:530px; height:530px; border-radius:50%; background:radial-gradient(circle,var(--hero-glow),transparent 68%); right:-240px; top:-220px; pointer-events:none; }
    .hero-grid { position:relative; display:grid; gap:28px; align-items:end; }
    .hero h1 { margin:8px 0 16px; max-width:800px; font-size:clamp(2.55rem,7vw,5.6rem); font-weight:900; letter-spacing:-.065em; line-height:.94; }
    .hero h1 em { color:var(--gold); font-style:normal; }
    .hero-actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
    .button { min-height:48px; padding:12px 18px; display:inline-flex; justify-content:center; align-items:center; gap:8px; border:1px solid transparent; border-radius:13px; color:#fff; background:linear-gradient(135deg,var(--navy),var(--blue)); text-decoration:none; font-weight:800; box-shadow:0 8px 18px rgba(23,58,90,.18); transition:transform .2s,box-shadow .2s; }
    .button:hover { transform:translateY(-3px); box-shadow:0 12px 25px rgba(23,58,90,.24); }
    .button.secondary { color:var(--text); background:transparent; border-color:var(--edge); box-shadow:none; }
    .button.gold { background:linear-gradient(135deg,#ab8848,var(--gold)); color:#1b2731; }

    /* ===== Sector cards ===== */
    section { padding:74px 0; }
    .sector-head { display:flex; flex-direction:column; gap:10px; margin-bottom:34px; }
    .sector-grid { display:grid; grid-template-columns:1fr; gap:20px; perspective:1200px; }
    .sector-wrap { position:relative; min-height:295px; transform-style:preserve-3d; }
    .sector-layer { position:absolute; inset:10px -8px -8px 8px; background:var(--gold-soft); border:1px solid var(--gold); border-radius:var(--radius); transform:translateZ(-16px); transition:transform .28s,box-shadow .28s; }
    .sector-card { position:relative; z-index:1; width:100%; min-height:287px; display:flex; flex-direction:column; padding:24px; text-align:start; color:var(--text); background:var(--surface); border:1px solid var(--edge); border-top:3px solid var(--gold); border-radius:var(--radius); box-shadow:var(--shadow); transform-style:preserve-3d; transition:transform .18s ease,box-shadow .28s; overflow:hidden; }
    [data-theme="dark"] .sector-card,.info-card,.quiz-card,.result-card,.course-card { backdrop-filter:blur(16px); }
    .sector-card::after { content:""; position:absolute; inset:0; opacity:0; background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 42%); transition:opacity .2s; pointer-events:none; }
    .sector-wrap:hover .sector-card,.sector-wrap:focus-within .sector-card { transform:translateY(-6px) translateZ(20px); box-shadow:0 24px 42px rgba(23,58,90,.2); }
    .sector-wrap:hover .sector-layer,.sector-wrap:focus-within .sector-layer { transform:translate(4px,8px) translateZ(-15px); box-shadow:0 16px 24px var(--gold-soft); }
    .sector-wrap:hover .sector-card::after { opacity:1; }
    .sector-icon { width:84px; height:84px; display:grid; place-items:center; border-radius:50%; font-size:2.7rem; background:linear-gradient(145deg,var(--surface2),var(--gold-soft)); border:1px solid var(--gold); box-shadow:inset 0 1px rgba(255,255,255,.5),0 12px 20px rgba(23,58,90,.1); transform:translateZ(35px); }
    .sector-card h3 { margin:19px 0 3px; font-size:1.45rem; line-height:1.2; transform:translateZ(26px); }
    .salary { margin:0; color:var(--muted); font-size:.91rem; font-weight:700; transform:translateZ(20px); }
    .sector-card .learn { margin-top:auto; padding-top:18px; display:flex; justify-content:space-between; align-items:center; font-weight:800; color:var(--navy); transform:translateZ(25px); }
    .badge { display:inline-flex; align-items:center; width:max-content; padding:4px 9px; border-radius:999px; background:var(--gold); color:#1e2c36; font-size:.76rem; font-weight:900; opacity:0; transform:translateY(8px); transition:opacity .2s,transform .2s; }
    .sector-wrap:hover .badge,.sector-wrap:focus-within .badge { opacity:1; transform:none; }

    /* ===== Dialog ===== */
    .modal { position:fixed; inset:0; z-index:200; display:grid; place-items:center; padding:16px; background:var(--overlay); backdrop-filter:blur(14px); opacity:0; visibility:hidden; transition:opacity .25s,visibility .25s; }
    .modal.open { opacity:1; visibility:visible; }
    .dialog { width:min(100%,990px); max-height:min(860px,calc(100dvh - 32px)); overflow:auto; border:1px solid rgba(223,189,120,.34); border-radius:26px; background:var(--bg); color:var(--text); box-shadow:0 28px 80px rgba(0,0,0,.45),0 0 42px rgba(57,132,204,.2); transform:translateY(18px) scale(.98); transition:transform .28s; }
    .modal.open .dialog { transform:none; }
    .modal-top { position:relative; display:grid; gap:24px; padding:56px 26px 28px; background:linear-gradient(135deg,var(--surface2),transparent); }
    .modal-visual { width:190px; height:190px; display:grid; place-items:center; border-radius:50%; background:radial-gradient(circle at 35% 28%,#fff7e4,var(--gold-soft) 58%,var(--navy)); border:1px solid var(--gold); box-shadow:inset 0 8px 18px rgba(255,255,255,.34),0 22px 36px rgba(5,15,26,.28); }
    .modal-visual span { font-size:5.2rem; filter:drop-shadow(8px 12px 8px rgba(23,58,90,.3)); animation:iconFloat 3s ease-in-out infinite alternate; }
    @keyframes iconFloat { to { transform:translateY(-8px) rotate(-4deg); } }
    .close { position:absolute; top:15px; right:15px; width:44px; height:44px; border:1px solid var(--edge); border-radius:50%; color:var(--text); background:var(--surface); font-size:1.4rem; }
    [dir="rtl"] .close { left:15px; right:auto; }
    .modal-title { margin:0 0 12px; font-size:clamp(2rem,5vw,3.4rem); line-height:1; font-weight:900; letter-spacing:-.05em; }
    .pills { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    .pill { padding:6px 11px; border-radius:999px; border:1px solid var(--gold); background:var(--gold-soft); color:var(--text); font-size:.83rem; font-weight:800; }
    .modal-intro { margin:0; color:var(--muted); font-size:1.02rem; }
    .modal-body { padding:0 26px 30px; }
    .info-grid { display:grid; grid-template-columns:1fr; gap:13px; }
    .info-card { padding:18px; border:1px solid var(--edge); border-radius:16px; background:var(--surface); box-shadow:0 8px 20px rgba(23,58,90,.07); transition:transform .2s; }
    .info-card:hover { transform:translateY(-3px); }
    .info-card h4 { margin:0 0 7px; font-size:1.05rem; }
    .info-card p { margin:0; color:var(--muted); font-size:.94rem; }
    .modal-cta { margin-top:23px; }

    /* ===== Quiz ===== */
    #quiz { background:linear-gradient(180deg,transparent,var(--surface2) 50%,transparent); }
    .quiz-shell { max-width:800px; }
    .quiz-heading { margin-bottom:27px; }
    .progress-row { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:.9rem; font-weight:800; }
    .progress-track { height:9px; margin:9px 0 20px; overflow:hidden; background:var(--gold-soft); border-radius:999px; }
    .progress-fill { height:100%; width:10%; background:linear-gradient(90deg,#173a5a,#c8a96a); border-radius:inherit; transition:width .35s; }
    .quiz-card { padding:25px; border:1px solid var(--edge); border-radius:22px; background:var(--surface); box-shadow:var(--shadow); }
    .quiz-card.q-in { animation:qIn .35s ease both; }
    @keyframes qIn { from { opacity:0; transform:translateX(60px) scale(.97); } to { opacity:1; transform:none; } }
    .question-kind { display:block; color:var(--gold); font-weight:900; font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; }
    .question { margin:6px 0 21px; font-weight:900; font-size:clamp(1.35rem,4vw,2rem); line-height:1.25; }
    .options { display:grid; gap:10px; }
    .option { position:relative; display:flex; align-items:center; gap:12px; width:100%; min-height:54px; padding:12px 15px; border:1px solid var(--edge); border-radius:14px; color:var(--text); background:transparent; text-align:start; transition:transform .18s,border-color .18s,background .18s,color .18s; cursor:pointer; }
    .option input { position:absolute; opacity:0; pointer-events:none; }
    .option-mark { flex:0 0 22px; width:22px; height:22px; display:grid; place-items:center; border:2px solid var(--gold); border-radius:50%; font-size:.76rem; color:transparent; }
    .option.multi .option-mark { border-radius:6px; }
    .option:hover { transform:translateX(-4px); border-color:var(--gold); }
    [dir="rtl"] .option:hover { transform:translateX(4px); }
    .option.sel { color:#fff; background:linear-gradient(135deg,#173a5a,#285f8f); border-color:#173a5a; transform:translateX(-6px) scale(1.02); }
    [dir="rtl"] .option.sel { transform:translateX(6px) scale(1.02); }
    .option.sel .option-mark { background:#fff; border-color:#fff; color:#173a5a; }
    .quiz-error { min-height:24px; margin:14px 0 0; color:#a93535; font-weight:800; }
    [data-theme="dark"] .quiz-error { color:#ffaaa4; }
    .quiz-nav { display:flex; justify-content:space-between; gap:10px; margin-top:19px; }
    .quiz-nav .button:disabled { opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }

    /* ===== Results ===== */
    .results { display:none; margin-top:36px; }
    .results.show { display:block; }
    .winner { display:grid; gap:18px; align-items:center; padding:26px; border:1px solid var(--gold); border-radius:22px; background:linear-gradient(135deg,var(--surface),var(--gold-soft)); box-shadow:var(--shadow); }
    .winner-icon { width:95px; height:95px; display:grid; place-items:center; font-size:3.4rem; border-radius:50%; background:var(--surface); border:1px solid var(--gold); box-shadow:0 12px 22px rgba(23,58,90,.15); }
    .winner h3 { margin:4px 0 5px; font-size:clamp(1.8rem,5vw,2.7rem); line-height:1; }
    .compatibility { color:var(--gold); font-weight:900; font-size:1.2rem; }
    .winner p { margin:7px 0 0; color:var(--muted); }
    .result-grid { display:grid; gap:22px; margin-top:25px; }
    .chart-card,.score-card,.course-card { padding:22px; border:1px solid var(--edge); border-radius:20px; background:var(--surface); }
    .chart-wrap { height:360px; position:relative; }
    .score-list { margin:0; padding:0; list-style:none; }
    .score-list li { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--edge); }
    .score-list li:last-child { border:0; }
    .score-list b { font-variant-numeric:tabular-nums; }
    .courses { display:grid; gap:10px; }
    .course-link { display:flex; justify-content:space-between; gap:10px; padding:12px; border:1px solid var(--edge); border-radius:12px; text-decoration:none; font-weight:800; transition:transform .2s,border-color .2s; }
    .course-link:hover { transform:translateY(-2px); border-color:var(--gold); }
    .result-actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:22px; }
    .share-fallback { display:none; width:100%; margin-top:14px; padding:10px; color:var(--text); background:var(--surface); border:1px solid var(--gold); border-radius:10px; }
    .share-fallback.show { display:block; }
    footer { padding:28px 16px 35px; text-align:center; color:var(--muted); font-size:.88rem; font-weight:700; }
    .status { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    @media (min-width:620px) { .sector-grid { grid-template-columns:repeat(2,1fr); } .modal-top { grid-template-columns:190px 1fr; align-items:center; padding:44px 38px 30px; } .modal-body { padding:0 38px 38px; } .info-grid { grid-template-columns:repeat(2,1fr); } .winner { grid-template-columns:95px 1fr; } }
    @media (min-width:850px) { .hero-grid { grid-template-columns:1.2fr .8fr; } .sector-grid { grid-template-columns:repeat(3,1fr); } .sector-wrap:last-child { grid-column:2; } .result-grid { grid-template-columns:1.2fr .8fr; } .course-card { grid-column:1/-1; } }
    @media (min-width:1040px) { .sector-grid { grid-template-columns:repeat(4,1fr); } .sector-wrap:last-child { grid-column:auto; } .sector-wrap:nth-child(5) { grid-column:1/3; } .sector-wrap:nth-child(6) { grid-column:3; } .sector-wrap:nth-child(7) { grid-column:4; } }
    @media (max-width:430px) { .header-logo span { display:none; } .nav { min-height:64px; } .toggle { padding:0 10px; } .quiz-card,.winner,.chart-card,.score-card,.course-card { padding:18px; } .chart-wrap { height:310px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important; } .splash { display:none; } header { opacity:1; transform:none; } .sector-wrap:hover .sector-card,.sector-wrap:focus-within .sector-card,.option.sel,.option:hover { transform:none; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#main" id="skipLink">Skip to content</a>
  <div class="splash" id="splash" aria-label="Vision 2030 opening animation">
    <div class="splash-brand"><span class="palm" aria-hidden="true">🌴</span><div class="splash-wordmark">VISION 2030<small>رؤية 2030</small></div></div>
    <button class="splash-skip" id="skipSplash" type="button">Skip animation</button>
  </div>
  <header>
    <nav class="nav container" aria-label="Primary navigation">
      <a class="header-logo" href="#main" aria-label="Vision 2030 Sector Explorer"><b aria-hidden="true">🌴</b><span>VISION <i>2030</i></span></a>
      <div class="header-actions">
        <button class="toggle" id="themeToggle" type="button" aria-pressed="false"></button>
        <button class="toggle" id="langToggle" type="button"></button>
      </div>
    </nav>
  </header>
  <main id="main">
    <section class="hero">
      <div class="container hero-grid">
        <div>
          <span class="eyebrow" id="heroEyebrow"></span>
          <h1 id="heroTitle"></h1>
          <p class="section-copy" id="heroCopy"></p>
          <div class="hero-actions"><a class="button" href="#sectors" id="exploreBtn"></a><button class="button secondary" id="heroQuiz" type="button"></button></div>
        </div>
      </div>
    </section>
    <section id="sectors">
      <div class="container">
        <div class="sector-head"><div><span class="eyebrow" id="sectorEyebrow"></span><h2 class="section-title" id="sectorTitle"></h2></div><p class="section-copy" id="sectorCopy"></p></div>
        <div class="sector-grid" id="sectorGrid"></div>
      </div>
    </section>
    <section id="quiz">
      <div class="container quiz-shell">
        <div class="quiz-heading"><span class="eyebrow" id="quizEyebrow"></span><h2 class="section-title" id="quizTitle"></h2><p class="section-copy" id="quizCopy"></p></div>
        <div id="quizArea" aria-live="polite"></div>
        <section class="results" id="results" aria-labelledby="resultTitle">
          <span class="eyebrow" id="resultEyebrow"></span><h2 class="section-title" id="resultTitle"></h2>
          <div id="winner"></div>
          <div class="result-grid"><div class="chart-card"><h3 id="chartTitle"></h3><p class="status" id="chartSummary"></p><div class="chart-wrap"><canvas id="radarChart"></canvas></div></div><div class="score-card"><h3 id="scoreTitle"></h3><ul class="score-list" id="scoreList"></ul></div><div class="course-card" id="courseCard"></div></div>
          <div class="result-actions"><button class="button gold" id="shareBtn" type="button"></button><button class="button secondary" id="retakeBtn" type="button"></button></div>
          <textarea class="share-fallback" id="shareFallback" readonly aria-label="Share text"></textarea>
        </section>
      </div>
    </section>
  </main>
  <footer>raghadalyami2004-lgtm.github.io • VISION 2030</footer>
  <div class="modal" id="modal" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="close" id="closeModal" type="button" aria-label="Close">×</button><div class="modal-top"><div class="modal-visual"><span id="modalIcon" aria-hidden="true"></span></div><div><h2 class="modal-title" id="modalTitle"></h2><div class="pills" id="modalPills"></div><p class="modal-intro" id="modalIntro"></p></div></div><div class="modal-body"><div class="info-grid" id="infoGrid"></div><button class="button modal-cta" id="modalQuiz" type="button"></button></div></div></div>
  <p class="status" id="liveStatus" aria-live="polite"></p>

  <script>
  /* ===== Application data ===== */
  const SECTOR_ORDER = ['medicine','nursing','engineering','tourism','media','cybersecurity','ai'];

    media:{ icon:'🎥', salary:'SAR 12k–30k+', title:{en:'Media',ar:'الإعلام'}, pillar:{en:'An Ambitious Nation',ar:'وطن طموح'}, intro:{en:'Media gives ideas a voice. It combines visual craft, journalism, strategy and technology to explain change, celebrate culture and build trusted conversations across platforms—from a documentary set to a digital campaign room.',ar:'الإعلام يمنح الأفكار صوتاً. يجمع الحرفة البصرية والصحافة والاستراتيجية والتقنية لشرح التغيير والاحتفاء بالثقافة وبناء حوارات موثوقة عبر المنصات، من موقع وثائقي إلى غرفة حملة رقمية.'}, goal:{en:'Strengthen cultural expression, creative industries and credible communication that connects Saudi stories to audiences.',ar:'تعزيز التعبير الثقافي والصناعات الإبداعية والتواصل الموثوق الذي يصل القصص السعودية بالجمهور.'}, group:{en:'Audiences, creators, public institutions, brands, cultural organisations and communities seeking clear information.',ar:'الجماهير والمبدعون والمؤسسات العامة والعلامات التجارية والمنظمات الثقافية والمجتمعات الباحثة عن معلومات واضحة.'}, skills:{en:'Story research, writing, photography or video, visual editing, audience insight, ethical communication and creative collaboration.',ar:'بحث القصص والكتابة والتصوير أو الفيديو والتحرير البصري وفهم الجمهور والتواصل الأخلاقي والتعاون الإبداعي.'}, future:{en:'Saudi creative industries are broadening opportunities in production, social strategy, cultural programming and brand storytelling. A strong portfolio, digital fluency and responsible storytelling support salary growth and national identity goals.',ar:'تتوسع الصناعات الإبداعية السعودية في فرص الإنتاج والاستراتيجية الاجتماعية والبرامج الثقافية وسرد العلامات. يدعم الملف القوي والطلاقة الرقمية والسرد المسؤول نمو الراتب وأهداف الهوية الوطنية.'}, why:{en:'Your selections highlight creative observation, communication and the instinct to turn a complex idea into a story people remember.',ar:'تبرز اختياراتك الملاحظة الإبداعية والتواصل وغريزة تحويل الفكرة المعقدة إلى قصة يتذكرها الناس.'}, courses:[['C     ['multi','What kind of problems do you enjoy solving?','ما نوع المشكلات التي تستمتعين بحلها؟',[['Health-related problems','مشكلات صحية',{medicine:3,nursing:2}],['Human-centered problems','مشكلات تتمحور حول الإنسان',{nursing:3}],['Construction problems','مشكلات البناء',{engineering:3}],['Hospitality problems','مشكلات الضيافة',{tourism:3}],['Communication problems','مشكلات التواصل',{media:3}],['Cyberattacks','الهجمات السيبرانية',{cybersecurity:3}],['Algorithms','الخوارزميات',{ai:3}]]],
    ['single','What is your style?','ما أسلوبك؟',[['Calm','هادئة',{medicine:2}],['Empathetic','متفهمة',{nursing:3,tourism:1,media:1}],['Logical','منطقية',{engineering:2,cybersecurity:2}],['Creative','مبدعة',{media:3,tourism:2}],['Analytical','تحليلية',{cybersecurity:2,ai:2}],['Innovative','مبتكرة',{ai:3}]]],
    ['multi','What are your skills?','ما مهاراتك؟',[['Biology','الأحياء',{medicine:2,nursing:2}],['Empathy','التعاطف',{nursing:2,tourism:2,media:1}],['Math','الرياضيات',{engineering:3}],['Photography','التصوير',{media:3}],['Networks','الشبكات',{cybersecurity:3}],['Programming','البرمجة',{ai:3}],['Service','الخدمة',{tourism:3}]]],
    ['single','What are you willing to learn?','ما الذي ترغبين في تعلمه؟',[['Many years of study','سنوات طويلة من الدراسة',{medicine:3}],['Hands-on human-centered work','عمل عملي يتمحور حول الإنسان',{nursing:3}],['Complex software','برمجيات معقدة',{engineering:3}],['Languages','اللغات',{tourism:3}],['Media tools','أدوات الإعلام',{media:3}],['Protection and security','الحماية والأمن',{cybersecurity:3}],['Advanced mathematics','رياضيات متقدمة',{ai:3}]]],
    ['single','What is your level with technology?','ما مستواك مع التقنية؟',[['Intermediate','متوسط',{medicine:1,nursing:1,tourism:1,media:1}],['Advanced','متقدم',{engineering:3}],['Expert','خبيرة',{cybersecurity:3,ai:3}]]],
    ['single','What type of schedule do you prefer?','أي نوع من الجداول تفضلين؟',[['Shifts','المناوبات',{medicine:3,nursing:3}],['Field-based','ميداني',{engineering:3}],['Seasonal','موسمي',{tourism:3}],['Flexible and creative','مرن وإبداعي',{media:3}],['Office-based with emergency situations','مكتبي مع حالات طارئة',{cybersecurity:3}],['Remote','عن بُعد',{ai:3}]]],
    ['single','What type of organization would you prefer?','ما نوع المؤسسة التي تفضلينها؟',[['Hospital','مستشفى',{medicine:3,nursing:3}],['Contracting/Construction company','شركة مقاولات أو بناء',{engineering:3}],['Hotel','فندق',{tourism:3}],['Agency','وكالة',{media:3}],['Government organization','جهة حكومية',{cybersecurity:3}],['Startup','شركة ناشئة',{ai:3}]]],
    ['single','What salary range do you prefer?','ما نطاق الراتب الذي تفضلينه؟',[['15k–25k SAR','15–25 ألف ريال',{nursing:2,tourism:2,media:2}],['25k–40k SAR','25–40 ألف ريال',{medicine:2,engineering:2,cybersecurity:2,ai:2}],['40k+ SAR','40 ألف ريال فأكثر',{medicine:3,ai:3,cybersecurity:2}],['Passion matters more','الشغف أهم',{medicine:1,nursing:1,engineering:1,tourism:1,media:1,cybersecurity:1,ai:1}]]],
    ['single','Where would you prefer to work?','أين تفضلين العمل؟',[['Hospital','مستشفى',{medicine:3,nursing:2}],['Construction/Field site','موقع بناء أو ميدان',{engineering:3}],['Tourist attractions','معالم سياحية',{tourism:3}],['Studio','استوديو',{media:3}],['Control center','مركز تحكم',{cybersecurity:3}],['Remote','عن بُعد',{ai:3}]]]

  /* ===== State and rendering ===== */
  let lang='en', theme='light', current=0, answers=Array(10).fill(null).map(()=>[]), activeSector=null, focusBeforeModal=null, chart=null;
  const $=s=>document.querySelector(s); const el=(tag,cls='')=>{const x=document.createElement(tag);x.className=cls;return x;}; const tr=key=>T[lang][key];
  function applyStatic(){
    const t=T[lang]; document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr'; document.title=lang==='ar'?'مستكشف قطاعات رؤية 2030':'Vision 2030 Sector Explorer';
    $('#skipLink').textContent=t.skipLink; $('#skipSplash').textContent=t.skip; $('#heroEyebrow').textContent=t.heroEyebrow; $('#heroTitle').innerHTML=t.heroTitle; $('#heroCopy').textContent=t.heroCopy; $('#exploreBtn').textContent=t.explore; $('#heroQuiz').textContent=t.startQuiz; $('#sectorEyebrow').textContent=t.sectorEyebrow; $('#sectorTitle').textContent=t.sectorTitle; $('#sectorCopy').textContent=t.sectorCopy; $('#quizEyebrow').textContent=t.quizEyebrow; $('#quizTitle').textContent=t.quizTitle; $('#quizCopy').textContent=t.quizCopy; $('#resultEyebrow').textContent=t.resultEyebrow; $('#resultTitle').textContent=t.resultTitle; $('#chartTitle').textContent=t.chartTitle; $('#scoreTitle').textContent=t.scoreTitle; $('#shareBtn').textContent=t.share; $('#retakeBtn').textContent=t.retake; $('#themeToggle').textContent=theme==='light'?t.night:t.day; $('#themeToggle').setAttribute('aria-pressed',String(theme==='dark')); $('#langToggle').textContent=t.switchAr;
  }
  function renderCards(){ const grid=$('#sectorGrid'); grid.innerHTML=''; SECTOR_ORDER.forEach(id=>{const s=S[id], wrap=el('div','sector-wrap'), layer=el('div','sector-layer'), btn=el('button','sector-card'); btn.type='button'; btn.dataset.sector=id; btn.setAttribute('aria-label',`${tr('learn')}: ${s.title[lang]}`); btn.innerHTML=`<span class="sector-icon" aria-hidden="true">${s.icon}</span><h3>${s.title[lang]}</h3><p class="salary">${s.salary}</p><div class="learn"><span>${tr('learn')}</span><span aria-hidden="true">${lang==='ar'?'←':'→'}</span></div><span class="badge">${tr('featured')}</span>`; wrap.append(layer,btn); grid.append(wrap); attachTilt(wrap,btn); }); }
  function attachTilt(wrap,card){ let active=false; function tilt(e){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return; const r=wrap.getBoundingClientRect(), x=((e.clientX-r.left)/r.width-.5)*24, y=((e.clientY-r.top)/r.height-.5)*-24; card.style.transform=`rotateX(${y}deg) rotateY(${x}deg) translateZ(20px)`;} wrap.addEventListener('pointermove',e=>{active=true;tilt(e)}); wrap.addEventListener('pointerleave',()=>{active=false;card.style.transform=''}); wrap.addEventListener('pointerup',()=>{if(active)setTimeout(()=>card.style.transform='',140)}); }
  function renderQuiz(){ const q=Q[current], isMulti=q[0]==='multi', t=T[lang], area=$('#quizArea'); const selected=answers[current]; area.innerHTML=''; const progress=el('div'); progress.innerHTML=`<div class="progress-row"><span>${t.question} ${current+1} / ${Q.length}</span><span>${isMulti?t.multi:t.single}</span></div><div class="progress-track" aria-hidden="true"><div class="progress-fill" style="width:${((current+1)/Q.length)*100}%"></div></div>`; const card=el('div','quiz-card q-in'); card.innerHTML=`<span class="question-kind">${isMulti?t.multi:t.single}</span><h3 class="question">${q[lang==='ar'?2:1]}</h3>`; const opts=el('div','options'); q[3].forEach((o,i)=>{const label=el('label',`option${isMulti?' multi':''}${selected.includes(i)?' sel':''}`); const input=el('input'); input.type=isMulti?'checkbox':'radio'; input.name=`q${current}`; input.value=i; input.checked=selected.includes(i); const mark=el('span','option-mark'); mark.textContent='✓'; label.append(input,mark,document.createTextNode(o[lang==='ar'?1:0])); input.addEventListener('change',()=>{ if(isMulti){answers[current]=[...opts.querySelectorAll('input:checked')].map(x=>+x.value);}else answers[current]=[i]; renderQuiz(); }); opts.append(label); }); card.append(opts); const error=el('p','quiz-error'); error.id='quizError'; card.append(error); const nav=el('div','quiz-nav'); const prev=el('button','button secondary'); prev.type='button';prev.textContent=t.previous;prev.disabled=current===0; prev.onclick=()=>{current--;renderQuiz();}; const next=el('button','button');next.type='button';next.textContent=current===Q.length-1?t.seeResults:t.next;next.onclick=()=>{if(!answers[current].length){error.textContent=t.answerError; $('#liveStatus').textContent=t.answerError; return;} if(current===Q.length-1)showResults();else{current++;renderQuiz();}}; nav.append(prev,next); card.append(nav); area.append(progress,card); }
  function getScores(){ const raw=Object.fromEntries(SECTOR_ORDER.map(id=>[id,0])); answers.forEach((a,qi)=>a.forEach(oi=>{const points=Q[qi][3][oi][2];Object.entries(points).forEach(([id,v])=>raw[id]+=v);})); const total=Object.values(raw).reduce((a,b)=>a+b,0); const pct={}; SECTOR_ORDER.forEach(id=>pct[id]=total?Math.min(100,Math.round((raw[id]/total)*100*1.8+15)):15); return {raw,pct}; }
  function showResults(){ const {raw,pct}=getScores(); const ranked=[...SECTOR_ORDER].sort((a,b)=>pct[b]-pct[a]||raw[b]-raw[a]||SECTOR_ORDER.indexOf(a)-SECTOR_ORDER.indexOf(b)); const winner=ranked[0], s=S[winner], t=T[lang]; $('#results').classList.add('show'); $('#winner').innerHTML=`<div class="winner"><div class="winner-icon" aria-hidden="true">${s.icon}</div><div><span class="eyebrow">${t.winner}</span><h3>${s.title[lang]}</h3><strong class="compatibility">${pct[winner]}% ${t.compatible}</strong><p><b>${t.role}:</b> ${s.why[lang]}</p></div></div>`; $('#scoreList').innerHTML=ranked.map((id,i)=>`<li><span>${S[id].title[lang]} ${i===0?`<small>${t.star}</small>`:''}</span><b>${pct[id]}%</b></li>`).join(''); $('#courseCard').innerHTML=`<h3>${t.courses} — ${s.title[lang]}</h3><p class="section-copy">${t.courseCopy}</p><div class="courses">${s.courses.map(c=>`<a class="course-link" href="${c[1]}" target="_blank" rel="noopener noreferrer"><span>${c[0]}</span><span aria-hidden="true">↗</span></a>`).join('')}</div>`; $('#chartSummary').textContent=t.chartSummary(s.title[lang],pct[winner]); $('#liveStatus').textContent=t.chartSummary(s.title[lang],pct[winner]); requestAnimationFrame(()=>{ $('#results').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}); createChart(ranked,pct,winner); }); }
  function createChart(ranked,pct,winner){ if(chart) chart.destroy(); if(!window.Chart){$('#chartSummary').textContent=T[lang].noChart;return;} const dark=theme==='dark', ctx=$('#radarChart').getContext('2d'), labels=ranked.map(id=>S[id].title[lang]); const values=ranked.map(id=>pct[id]); const winIndex=ranked.indexOf(winner); chart=new Chart(ctx,{type:'radar',data:{labels,datasets:[{label:T[lang].compatible,data:values,borderColor:'#c8a96a',backgroundColor:'rgba(200,169,106,.17)',pointBackgroundColor:values.map((_,i)=>i===winIndex?'#f2d59a':'#c8a96a'),pointBorderColor:dark?'#07101a':'#fff',pointRadius:values.map((_,i)=>i===winIndex?7:4),pointHoverRadius:8,borderWidth:3}]},options:{responsive:true,maintainAspectRatio:false,animation:matchMedia('(prefers-reduced-motion: reduce)').matches?false:{duration:650},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.label}: ${c.raw}%`}}},scales:{r:{min:0,max:100,ticks:{stepSize:20,showLabelBackdrop:false,color:dark?'#bdc8d4':'#5a6874',backdropColor:'transparent'},grid:{color:dark?'rgba(255,255,255,.15)':'rgba(23,58,90,.14)'},angleLines:{color:dark?'rgba(255,255,255,.17)':'rgba(23,58,90,.16)'},pointLabels:{color:dark?'#edf5fb':'#173a5a',font:{family:'Tajawal',size:13,weight:'700'}}}}}}); }
  function openModal(id,trigger){ activeSector=id; focusBeforeModal=trigger; const s=S[id],t=T[lang]; $('#modalIcon').textContent=s.icon; $('#modalTitle').textContent=s.title[lang]; $('#modalPills').innerHTML=`<span class="pill">${t.pillar}: ${s.pillar[lang]}</span><span class="pill">${t.salary}: ${s.salary}</span>`; $('#modalIntro').textContent=s.intro[lang]; $('#infoGrid').innerHTML=[[t.goal,s.goal[lang]],[t.group,s.group[lang]],[t.skills,s.skills[lang]],[t.future,s.future[lang]]].map(x=>`<article class="info-card"><h4>${x[0]}</h4><p>${x[1]}</p></article>`).join(''); $('#modalQuiz').textContent=t.modalStart; $('#closeModal').setAttribute('aria-label',lang==='ar'?'إغلاق':'Close'); $('#modal').classList.add('open');document.body.classList.add('modal-open');setTimeout(()=>$('#closeModal').focus(),60); }
  function closeModal(){ $('#modal').classList.remove('open');document.body.classList.remove('modal-open');if(focusBeforeModal)focusBeforeModal.focus(); }
  function startQuiz(){ closeModal(); setTimeout(()=>{ $('#quiz').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}); $('#quizArea input')?.focus(); },100); }
  async function share(){ const ranked=[...SECTOR_ORDER].sort((a,b)=>getScores().pct[b]-getScores().pct[a]); const p=getScores().pct[ranked[0]], message=T[lang].shareText(S[ranked[0]].title[lang],p); try{if(navigator.share){await navigator.share({title:T[lang].shareTitle,text:message});$('#liveStatus').textContent='';return;} if(navigator.clipboard){await navigator.clipboard.writeText(message);$('#liveStatus').textContent=T[lang].copied;return;}throw Error('No share API');}catch(e){const area=$('#shareFallback');area.value=`${T[lang].manualCopy}\n${message}`;area.classList.add('show');area.focus();area.select();}}
  function retake(){ answers=Array(10).fill(null).map(()=>[]);current=0;if(chart){chart.destroy();chart=null;}$('#results').classList.remove('show');$('#shareFallback').classList.remove('show');renderQuiz();$('#quiz').scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>$('#quizArea input')?.focus(),400); }
  function setTheme(){theme=theme==='light'?'dark':'light';document.documentElement.dataset.theme=theme;localStorage.setItem('vision-theme',theme);applyStatic();if($('#results').classList.contains('show'))showResults();}
  function setLang(){lang=lang==='en'?'ar':'en';applyStatic();renderCards();renderQuiz();if(activeSector&&$('#modal').classList.contains('open'))openModal(activeSector,focusBeforeModal);if($('#results').classList.contains('show'))showResults();}
  function finishSplash(){const splash=$('#splash');if(!splash||splash.dataset.done)return;splash.dataset.done='1';splash.classList.add('exit');document.body.classList.add('ready');setTimeout(()=>splash.remove(),600);}
  function init(){ theme=localStorage.getItem('vision-theme')||'light';document.documentElement.dataset.theme=theme;applyStatic();renderCards();renderQuiz(); if(matchMedia('(prefers-reduced-motion: reduce)').matches){finishSplash();}else{setTimeout(()=>$('#splash')?.classList.add('shrink'),1400);setTimeout(finishSplash,2300);} $('#skipSplash').onclick=finishSplash; $('#themeToggle').onclick=setTheme;$('#langToggle').onclick=setLang;$('#heroQuiz').onclick=()=>{ $('#quiz').scrollIntoView({behavior:'smooth'});setTimeout(()=>$('#quizArea input')?.focus(),500);};$('#sectorGrid').onclick=e=>{const b=e.target.closest('[data-sector]');if(b)openModal(b.dataset.sector,b);};$('#closeModal').onclick=closeModal;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal();};$('#modalQuiz').onclick=startQuiz;$('#shareBtn').onclick=share;$('#retakeBtn').onclick=retake; document.addEventListener('keydown',e=>{if(!$('#modal').classList.contains('open'))return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const f=[...$('#modal .dialog').querySelectorAll('button,[href],input,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled);const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}); }
  init();
  </script>
